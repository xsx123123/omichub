# --------------------------------------------
# 注册策略提示文案（登录页"注册"按钮用）
# --------------------------------------------
# 当后台关闭自助注册（site-settings.registration_enabled = false）时，登录页点击"注册"
# 按钮不会跳转，而是弹出 Toast 提示。这里配置该提示文案与管理员联系方式，改文件后刷新即生效。
#
# 注意：注册的真正开关由管理员在「用户管理」页切换（存数据库），后端 /auth/register 会强制校验；
#       本文件只决定"关闭注册时提示什么文案、联系谁"，不控制开关本身。
registration:
  # 注册关闭时的提示文案
  disabled_message: "叮咚！自助注册通道暂时休息啦～(≧▽≦) 想要加入平台的话，请呼叫管理员为你创建专属账号呀！"
  # 暂停注册时提示联系的管理员（邮箱或说明，例：admin@hzau.edu.cn）；留空则 Toast 不显示联系方式
  admin_contact: "zhangjian199567@outlook.com"

