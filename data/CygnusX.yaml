# ============================================
# AI 助手配置
# ============================================
# enabled 列表中的名称对应 data/ai/{name}.yaml 文件。
# 仅列出的助手会被加载到数据库；未列出的不会出现在前台。
# 新增助手：1) 在 data/ai/ 下创建 yaml  2) 在此处加入文件名
agents:
  # 内部系统任务：不进入公开助手同步与招募列表。
  system_enabled: [welcome_copywriter]
  enabled:
    - router
    - general
    - agentteams_manager
    - rnaseq
    - atacseq
    - scrna
    - scrna_upstream
    - scrna_integration
    - scrna_advanced
    - code
    - explorer
    - viz
    - data
    - qc
    - delivery
    - cloud_ops
    - shania
    - mcp_builder
    - skill_builder

