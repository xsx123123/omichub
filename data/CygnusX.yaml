# ============================================
# CygnusX 首页文案配置
# ============================================
# 修改本文件后刷新前端页面即生效，无需重启后端、无需重新构建前端。
# 字段缺失或解析失败时，系统会自动回退到内置默认文案，首页不会报错。
#
# quick_entries 是首页快捷入口的静态兜底文案。
# 实际展示哪些页面由管理员在「首页入口管理」中配置，并存储在 site_settings.home_quick_entries。
# 当数据库配置不可用时，前端会按这里的 key 回退到默认路由与图标。

platform:
  title: "CygnusX · 天鹅座智能科研平台"
  author: "JZHANG"
  email: "zhangjian199567@outlook.com"
  github: "https://github.com/xsx123123"

# ============================================
# 存储目录配置
# ============================================
# 平台数据根目录统一在此声明，后端所有需要数据路径的逻辑都读取本段，
# 避免在代码中硬编码。解析优先级：
#   1) 本文件 storage.data_root
#   2) 环境变量 STORAGE_PATH（.env，默认 /data/cygnusx）
#   3) 内置兜底 /data/cygnusx
# 文件缺失 / 解析失败 / 字段为空时自动降级到下一级，绝不抛异常。
#
# users_subdir：用户数据子目录名（与 FileService 落盘约定一致），
# 实际用户目录为 {data_root}/{users_subdir}/{user_id}/。
storage:
  data_root: ""  # 跟随 STORAGE_PATH，避免路径工厂与执行器使用不同的数据根
  users_subdir: "users"
  shared_subdir: "shared"
  system_subdir: "system"
  # 存储后端类型：local（本地文件系统）| s3（S3 兼容对象存储）
  type: "local"
  s3:
    endpoint: ""
    bucket: "cygnusx-data"
    region: ""
    access_key: ""
    secret_key: ""

  # 文件生命周期管理
  lifecycle:
    upload_session_timeout_hours: 24
    work_retention_days: 30
    output_archive_days: 90
    archive_mode: "archive"  # archive（压缩归档）| delete（彻底删除）

  # 共享资源路径（相对 data_root）
  shared:
    references: "shared/references"
    blast_db: "shared/blast_db"
    annotations: "shared/annotations"
    bin: "shared/bin"

