agent_id: welcome_copywriter
name: 欢迎语撰写员
description: 内部离线欢迎文案任务，仅处理批准的公开事实。
prompt_file: prompts/welcome/system.v3.md
temperature: 0.8
max_tokens: 4096
mcp_ids: []
skill_ids: []
tools: []
features:
  internal_only: true
  prompt_version: v3
studio:
  enabled: false
creative_directions:
  - [观察中的意外, 独立复核的价值, 伙伴之间的倾听, 科学假设的边界, 任务拆解, 阅读文献的思考, 关键参数的记录, 给专注留出休息]
  - [探索需要耐心, 负结果也有研究价值, 资料整理的条理, 好问题胜过快答案, 证据表达的清晰, 灵感先记在草稿, 解释需要接受检验, 协作中的互相理解]
  - [复现的方法意识, 未知带来的发现, 审慎解读证据, 记录失败的尝试, 用图表达科学问题, 分析步骤的次序, 团队互助, 从不同角度观察]
  - [研究节奏与余力, 追问问题的勇气, 元数据与记录, 方法比较的思考, 分享科研经验, 回顾流程要点, 给思绪留白, 质量审查的细节]
  - [保持自己的科研节奏, 把大问题拆小, 细节中的新线索, 清晰命名的步骤, 尊重第二种解释, 团队讨论与耐心, 整理分析记录, 观察值得被认真对待]
