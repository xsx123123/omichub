# CygnusX Nginx 配置 - 生产环境（含 SSL）

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式（JSON 结构化，便于 Loki/Promtail 抓取）
    log_format cygnusx_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"service":"nginx",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$http_x_request_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log cygnusx_json;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # ===== Gzip 压缩（首次加载核心优化）=====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               application/rss+xml application/atom+xml image/svg+xml
               font/woff font/woff2 application/font-woff application/font-woff2;

    # WebSocket 支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 限流
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Docker DNS 动态更新：容器重建换 IP 后无需重启 Nginx（需 Nginx >= 1.27.3）。
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream cygnusx_backend {
        zone cygnusx_backend 64k;
        least_conn;
        server web:8000 resolve max_fails=1 fail_timeout=5s;
        server web-replica:8000 resolve max_fails=1 fail_timeout=5s;
    }

    # SSE 即时透传；失败只在尚可安全重试时切换，不启用 non_idempotent。
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    server {
        listen 80;
        server_name _;
        # HTTP 强制跳转 HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        # 通用安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        ssl_certificate /etc/ssl/certs/ssl-cert.pem;
        ssl_certificate_key /etc/ssl/certs/ssl-cert.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html;
        index index.html;

        # API 代理（HTTP + WebSocket）
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://cygnusx_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }

        # Native research UI uses the authenticated BFF. Keep legacy account/chat
        # paths private; the Node service remains available on the internal network.
        # Stable module entry must revalidate; its font/image assets are fingerprinted.
        location = /treasure-island/treasure-island.js {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Vue history entry: direct navigation and refresh must load the platform SPA.
        location = /treasure-mouse {
            try_files /index.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location = /treasure-mouse/ {
            return 302 /treasure-mouse$is_args$args;
        }
        location ^~ /treasure-mouse/ {
            return 404;
        }

        # 健康检查
        location /health {
            proxy_pass http://cygnusx_backend;
        }

        # 知识库图片等静态资源转发到后端 docs 目录
        location /docs-static/ {
            proxy_pass http://cygnusx_backend;
        }

        # ===== JBrowse 2 基因组浏览器 =====
        # 静态产物：^~ 前缀防止正则 \.(js|css)$ 抢占 /jbrowse2/static/*.js
        location ^~ /jbrowse2/ {
            alias /var/www/jbrowse2/;
            try_files $uri $uri/ =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 数据文件访问（HTTP Range Request 流式读取大文件）
        # ⚠️ 安全：本路径仅允许 RFC1918 内网 IP 访问；公网/多租户场景请改用后端鉴权代理或 VPN。
        # 数据根容器内路径由 STORAGE_PATH 决定（与 compose 数据挂载目标一致；
        # 换根部署时改 .env 的 STORAGE_PATH 即可，勿在此写死宿主路径）。
        location ^~ /tracks/ {
            alias /srv/tracks/;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Content-Type" always;
            add_header Accept-Ranges bytes always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
