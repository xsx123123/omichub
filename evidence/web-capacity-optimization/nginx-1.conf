pid /tmp/webperf_scale_20261027_b1/nginx.pid;
error_log /tmp/webperf_scale_20261027_b1/error.log warn;
worker_processes 1;
events { worker_connections 4096; }
http {
 log_format capacity 'n=1 $upstream_addr $status $request_time';
 access_log /tmp/webperf_scale_20261027_b1/access.log capacity;
 client_body_temp_path /tmp/webperf_scale_20261027_b1/client;
 proxy_temp_path /tmp/webperf_scale_20261027_b1/proxy;
 upstream capacity_backend {
  least_conn;
        server web:18101;
  keepalive 64;
 }
 server {
  listen 18180;
  location / {
   proxy_pass http://capacity_backend;
