pid /tmp/webperf_scale_20261027_c1/nginx.pid;
error_log /tmp/webperf_scale_20261027_c1/error.log warn;
worker_processes 1;
events { worker_connections 4096; }
http {
 log_format capacity 'n=16 $upstream_addr $status $request_time';
 access_log /tmp/webperf_scale_20261027_c1/access.log capacity;
 client_body_temp_path /tmp/webperf_scale_20261027_c1/client;
 proxy_temp_path /tmp/webperf_scale_20261027_c1/proxy;
 upstream capacity_backend {
  least_conn;
        server web:18301;
        server web:18302;
        server web:18303;
        server web:18304;
        server web:18305;
        server web:18306;
        server web:18307;
        server web:18308;
        server web:18309;
        server web:18310;
        server web:18311;
        server web:18312;
        server web:18313;
        server web:18314;
        server web:18315;
        server web:18316;
  keepalive 64;
 }
 server {
  listen 18380;
  location / {
   proxy_pass http://capacity_backend;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_buffering off;
   proxy_read_timeout 20s;
   add_header X-Capacity-Replicas 16 always;
   add_header X-Capacity-Upstream $upstream_addr always;
  }
 }
}
