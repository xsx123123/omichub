pid /tmp/webperf_scale_20261027_d1/nginx.pid;
error_log /tmp/webperf_scale_20261027_d1/error.log warn;
worker_processes 1;
events { worker_connections 4096; }
http {
 log_format capacity 'n=16 $upstream_addr $status $request_time';
 access_log /tmp/webperf_scale_20261027_d1/access.log capacity;
 client_body_temp_path /tmp/webperf_scale_20261027_d1/client;
 proxy_temp_path /tmp/webperf_scale_20261027_d1/proxy;
 upstream capacity_backend {
  least_conn;
        server web:18601;
        server web:18602;
        server web:18603;
        server web:18604;
        server web:18605;
        server web:18606;
        server web:18607;
        server web:18608;
        server web:18609;
        server web:18610;
        server web:18611;
        server web:18612;
        server web:18613;
        server web:18614;
        server web:18615;
        server web:18616;
  keepalive 64;
 }
 server {
  listen 18680;
  location / {
   proxy_pass http://capacity_backend;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_buffering off;
   proxy_read_timeout 20s;
   add_header X-Capacity-Replicas 16 always;
   add_header X-Capacity-Upstream $upstream_addr always;
  }
 }
}
